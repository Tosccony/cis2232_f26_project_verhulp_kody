<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Reports')}"></head>
<body>
<header th:replace="~{fragments/navHeader :: navbar('reports')}"></header>

<main class="app-main">
    <div class="page-header">
        <h1 class="page-title">Reports</h1>
        <p class="page-lede">Choose a report and enter its criteria. The results are shown on screen and saved to a file.</p>
    </div>

    <div class="link-grid">
        <a class="card link-card" th:href="@{/report/loadsheet/history}">
            <div class="card-title" th:text="#{label.report.loading.history}">Aircraft Loading History</div>
            <div class="card-caption" th:text="#{label.report.loading.history.description}">description</div>
            <div class="link-cta">Open report <i class="fas fa-arrow-right"></i></div>
        </a>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
