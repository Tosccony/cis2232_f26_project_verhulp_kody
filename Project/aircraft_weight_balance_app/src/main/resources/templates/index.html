<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(null)}"></head>
<body>
<header th:replace="~{fragments/navHeader :: navbar('home')}"></header>

<main class="app-main">
    <div class="page-header">
        <h1 class="page-title" th:text="#{application.name}">Aircraft Weight and Balance Sheet</h1>
        <p class="page-lede" th:text="#{label.home.description}">description</p>
    </div>

    <h2 class="section-title">Reports</h2>
    <div class="link-grid">
        <a class="card link-card" th:href="@{/report/loadsheet/history}">
            <div class="card-title" th:text="#{label.report.loading.history}">Aircraft Loading History</div>
            <div class="card-caption" th:text="#{label.report.loading.history.description}">description</div>
            <div class="link-cta">Open report <i class="fas fa-arrow-right"></i></div>
        </a>
    </div>

    <h2 class="section-title">Cessna 172S limits</h2>
    <div class="tiles">
        <div class="card">
            <div class="tile-label">Maximum gross weight</div>
            <div class="tile-value">2,550 lb</div>
        </div>
        <div class="card">
            <div class="tile-label">Maximum baggage</div>
            <div class="tile-value">120 lb</div>
        </div>
        <div class="card">
            <div class="tile-label">Centre of gravity range</div>
            <div class="tile-value">35.0 to 47.3 in</div>
            <div class="tile-note">Inches aft of the datum. The forward limit moves back to 41.0 in at 2,550 lb.</div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
