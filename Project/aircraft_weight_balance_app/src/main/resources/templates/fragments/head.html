<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--title: the page name for the browser tab, or null on the home page-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title != null} ? ${title} + ' – ' + #{application.name} : #{application.name}">Aircraft Weight and Balance Sheet</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <!--Icon font: the icons show as soon as the page draws (and in print), no script needed-->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
</html>
