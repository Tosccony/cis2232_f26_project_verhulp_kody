<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--section: home, reports or about, so that link is marked as the current page-->
<header th:fragment="navbar(section)" class="app-header">
    <div class="app-header-inner">
        <a class="app-brand" th:href="@{/}">
            <img src="/images/ic_launcher.png" alt="" width="36" height="36">
            <span th:text="#{application.name}">Aircraft Weight and Balance Sheet</span>
        </a>
        <nav class="app-nav" aria-label="Main">
            <a th:href="@{/}" th:attr="aria-current=${section == 'home'} ? 'page'">Home</a>
            <a th:href="@{/report}" th:attr="aria-current=${section == 'reports'} ? 'page'">Reports</a>
            <a th:href="@{/about}" th:attr="aria-current=${section == 'about'} ? 'page'">About</a>
        </nav>
    </div>
</header>
</html>
