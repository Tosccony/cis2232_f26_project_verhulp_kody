# Port configuration
server.port=8080

# Connection settings (Add your url, username, and password)
spring.datasource.url=jdbc:mysql://localhost:3306/cis2232_aircraft_weight_balance
spring.datasource.username=root
spring.datasource.password=

# Hibernate & JPA optimization
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Named so the app also starts on MariaDB (the MySQL driver can't read MariaDB's keyword list)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# UI Template configuration
spring.thymeleaf.cache=false

# Keep your GraphiQL testing configuration active
spring.graphql.graphiql.enabled=true